name: 每日自動掃描與發送Email

on:
  schedule:
    # 使用 UTC 時間。台灣時間(UTC+8)下午 4:30，對應 UTC 時間為早上 8:30。
    # 這裡設定每週一到週五的 08:30 (UTC) 執行。
    - cron: '10 9 * * 1-5'
  workflow_dispatch: # 加上這個可以讓您在 GitHub 網頁上手動點擊執行測試

jobs:
  build_and_scan:
    runs-on: ubuntu-latest

    steps:
    - name: 取得程式碼 (Checkout repository)
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝所需套件
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas

    - name: 執行量化掃描腳本
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        python auto_scan.py
