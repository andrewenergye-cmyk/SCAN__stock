name: 每日自動掃描與發送Email

on:
  workflow_dispatch:
  schedule:
    # 💡 這裡我先幫您改回標準的下午 16:30 (台灣時間)
    # 如果您想測試，可以自行修改為未來的時間
    - cron: '18 22 * * 1-5'
    - cron: '38 3 * * 1-5'
jobs:
  build_and_scan:
    runs-on: ubuntu-latest

    steps:
    - name: 取得程式碼 (Checkout repository)
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝所需套件
      run: |
        python -m pip install --upgrade pip
        # 💡 這裡改為直接安裝所有需要的套件 (包含 Google 試算表需要的)
        pip install yfinance pandas gspread google-auth

    - name: 執行量化掃描腳本
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        # 💡 [重要新增] 讓機器人拿得到 Google 的金鑰與網址！
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
      run: |
        python auto_scan.py
